on:
  pull_request:
    branches:
      - main
    types:
      - closed

name: Release Candidate

jobs:
  if-merged:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR was merged
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo The PR was merged with title: "$PR_TITLE"

  review-commits-since-last-release:
    runs-on: ubuntu-latest
    needs: [if-merged]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update release candidate tags if necessary
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --quiet
          LATEST_RELEASE=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n1 || true)

          if [[ -n "$LATEST_RELEASE" ]]; then
            BASE_VERSION="${LATEST_RELEASE#v}"
            COMMIT_RANGE="${LATEST_RELEASE}..HEAD"
          else
            LATEST_RELEASE="v0.0.0"
            BASE_VERSION="0.0.0"
            COMMIT_RANGE="HEAD"
          fi

          COMMITS=()
          while IFS= read -r COMMIT; do
            COMMITS+=("$COMMIT")
          done < <(git rev-list --reverse "$COMMIT_RANGE")

          echo "Latest release tag: $LATEST_RELEASE"

          if (( ${#COMMITS[@]} == 0 )); then
            echo "No commits found after $LATEST_RELEASE"
            exit 0
          fi

          IFS='.' read -r BASE_MAJOR BASE_MINOR BASE_PATCH <<< "$BASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          NEW_REFS=()
          PRIOR_COMMIT_COUNT=$((${#COMMITS[@]} - 1))
          CURRENT_PRECEDENCE=0
          RC_VERSION="$BASE_VERSION"
          RC_NUMBER=0

          for (( INDEX = 0; INDEX < PRIOR_COMMIT_COUNT; INDEX++ )); do
            COMMIT="${COMMITS[$INDEX]}"
            SUBJECT=$(git log -1 --format=%s "$COMMIT")
            NORMALIZED_SUBJECT=$(printf '%s' "$SUBJECT" | tr '[:upper:]' '[:lower:]')

            if [[ "$NORMALIZED_SUBJECT" == *"[major]"* ]]; then
              BUMP="major"
              PRECEDENCE=3
            elif [[ "$NORMALIZED_SUBJECT" == *"[minor]"* ]]; then
              BUMP="minor"
              PRECEDENCE=2
            elif [[ "$NORMALIZED_SUBJECT" == *"[patch]"* ]]; then
              BUMP="patch"
              PRECEDENCE=1
            elif [[ "$NORMALIZED_SUBJECT" == *"[no-bump]"* ]]; then
              BUMP="no-bump"
              PRECEDENCE=0
            else
              BUMP="patch"
              PRECEDENCE=1
            fi

            if (( PRECEDENCE > CURRENT_PRECEDENCE )); then
              case "$BUMP" in
                major) RC_VERSION="$((BASE_MAJOR + 1)).0.0" ;;
                minor) RC_VERSION="${BASE_MAJOR}.$((BASE_MINOR + 1)).0" ;;
                patch) RC_VERSION="${BASE_MAJOR}.${BASE_MINOR}.$((BASE_PATCH + 1))" ;;
              esac
              CURRENT_PRECEDENCE=$PRECEDENCE
              RC_NUMBER=1
            else
              RC_NUMBER=$((RC_NUMBER + 1))
            fi

            echo "${COMMIT:0:7} [$BUMP] $SUBJECT -> v${RC_VERSION}-rc.${RC_NUMBER}"
            CORRECTED_TAG="v${RC_VERSION}-rc.${RC_NUMBER}"

            if git rev-parse -q --verify "refs/tags/$CORRECTED_TAG" >/dev/null; then
              TAGGED_COMMIT=$(git rev-list -n1 "$CORRECTED_TAG")
              if [[ "$TAGGED_COMMIT" != "$COMMIT" ]]; then
                echo "::error::Tag $CORRECTED_TAG already points to $TAGGED_COMMIT instead of $COMMIT"
                exit 1
              fi

              echo "$CORRECTED_TAG already points to ${COMMIT:0:7}"
              continue
            fi

            git tag -a "$CORRECTED_TAG" "$COMMIT" -m "Release candidate $CORRECTED_TAG"
            NEW_REFS+=("refs/tags/${CORRECTED_TAG}:refs/tags/${CORRECTED_TAG}")
            echo "Added corrected tag $CORRECTED_TAG to ${COMMIT:0:7}"
          done

          if (( ${#NEW_REFS[@]} > 0 )); then
            git push origin "${NEW_REFS[@]}"
          else
            echo "No earlier RC tags need correction"
          fi

  mark-as-release-candidate:
    runs-on: ubuntu-latest
    needs: [review-commits-since-last-release]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark as Release Candidate
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # Determine bump type from PR title (env var avoids script injection)
          if [[ "$PR_TITLE" == *"[major]"* ]]; then
            BUMP="major"
          elif [[ "$PR_TITLE" == *"[minor]"* ]]; then
            BUMP="minor"
          elif [[ "$PR_TITLE" == *"[patch]"* ]]; then
            BUMP="patch"
          elif [[ "$PR_TITLE" == *"[no-bump]"* ]]; then
            BUMP="no-bump"
          else
            echo "::error::PR title must contain [major], [minor], [patch], or [no-bump]"
            exit 1
          fi
          echo "Detected bump type: $BUMP"

          precedence() {
            case "$1" in
              major) echo 3 ;;
              minor) echo 2 ;;
              patch) echo 1 ;;
              *) echo 0 ;;
            esac
          }
          NEW_PRECEDENCE=$(precedence "$BUMP")

          git fetch --tags --quiet

          # Latest actual release tag (vX.Y.Z, no -rc suffix) is the base of the current cycle
          LATEST_RELEASE=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -Ev -- '-rc\.[0-9]+$' | sort -V | tail -n1)
          LATEST_RELEASE=${LATEST_RELEASE:-v0.0.0}

          # Latest tag overall (release or rc) tells us whether a cycle is in progress
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)

          echo "Latest release tag: $LATEST_RELEASE"
          echo "Latest tag overall: ${LATEST_TAG:-none}"

          BASE_VERSION="${LATEST_RELEASE#v}"
          IFS='.' read -r BASE_MAJOR BASE_MINOR BASE_PATCH <<< "$BASE_VERSION"

          CURRENT_PRECEDENCE=0
          RC_NUM=0
          RC_MAJOR=$BASE_MAJOR
          RC_MINOR=$BASE_MINOR
          RC_PATCH=$BASE_PATCH

          if [[ -n "$LATEST_TAG" && "$LATEST_TAG" =~ -rc\.([0-9]+)$ ]]; then
            RC_NUM="${BASH_REMATCH[1]}"
            RC_BASE_VER=$(echo "$LATEST_TAG" | sed -E 's/^v//; s/-rc\.[0-9]+$//')
            IFS='.' read -r RC_MAJOR RC_MINOR RC_PATCH <<< "$RC_BASE_VER"

            if [[ "$RC_MAJOR" != "$BASE_MAJOR" ]]; then
              CURRENT_BUMP="major"
            elif [[ "$RC_MINOR" != "$BASE_MINOR" ]]; then
              CURRENT_BUMP="minor"
            elif [[ "$RC_PATCH" != "$BASE_PATCH" ]]; then
              CURRENT_BUMP="patch"
            else
              # rc's base version matches the latest release exactly: it was already promoted, no cycle in progress
              CURRENT_BUMP="none"
            fi
            CURRENT_PRECEDENCE=$(precedence "$CURRENT_BUMP")
          fi

          if (( NEW_PRECEDENCE > CURRENT_PRECEDENCE )); then
            # Higher-precedence bump starts a new cycle from the latest release
            case "$BUMP" in
              major) NEW_MAJOR=$((BASE_MAJOR + 1)); NEW_MINOR=0; NEW_PATCH=0 ;;
              minor) NEW_MAJOR=$BASE_MAJOR; NEW_MINOR=$((BASE_MINOR + 1)); NEW_PATCH=0 ;;
              patch) NEW_MAJOR=$BASE_MAJOR; NEW_MINOR=$BASE_MINOR; NEW_PATCH=$((BASE_PATCH + 1)) ;;
            esac
            NEW_RC=1
          else
            # Same or lower precedence: stay on the current cycle version, bump the rc number
            NEW_MAJOR=$RC_MAJOR
            NEW_MINOR=$RC_MINOR
            NEW_PATCH=$RC_PATCH
            NEW_RC=$((RC_NUM + 1))
          fi

          NEW_TAG="v${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}-rc.${NEW_RC}"
          echo "New RC tag: $NEW_TAG"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release candidate $NEW_TAG"
          git push origin "$NEW_TAG"

  deploy-to-dev:
    needs: mark-as-release-candidate
    runs-on: ubuntu-latest
    steps:
      - name: Automatic Deploy to Dev
        run: echo "Deploying to Dev..."

  deploy-to-uat:
    needs: [mark-as-release-candidate, deploy-to-dev]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to UAT
        run: echo "Deploying to UAT..."