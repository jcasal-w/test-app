on:
  release:
    types: [created]
  
name: Release

jobs:
  check-release-matches-rc:
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.gate-rc.outputs.base_version }}
    steps:
      - name: Gate RC release
        id: gate-rc
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ github.event.release.tag_name }}"
          NAME="${{ github.event.release.name }}"

          # Require tags like v0.2.0-rc3
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc[0-9]+$ ]]; then
            echo "Skipping: not a valid RC prerelease tag: $TAG"
            exit 1
          fi

          BASE_VERSION="v${BASH_REMATCH[1]}"

          # Require release name to be the base version, including leading v
          if [[ "$NAME" != "$BASE_VERSION" ]]; then
            echo "Invalid release name: expected '$BASE_VERSION', got '$NAME'"
            exit 1
          fi

          echo "Gate passed for RC release: tag=$TAG name=$NAME"
          echo "Base version: $BASE_VERSION"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

  validate:
    needs: check-release-matches-rc
    uses: ./.github/workflows/validate.yml

  mark-for-release:
    needs: [validate, check-release-matches-rc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Mark as Release
        shell: bash
        run: |
          set -euo pipefail

          echo "Marking as release..."
          NEW_TAG="${{ needs.check-release-matches-rc.outputs.base_version }}"
          echo "Tagging as release: $NEW_TAG"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

  deploy-to-uat:
    needs: mark-for-release
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to UAT
        run: echo "Deploying to UAT..."

  deploy-to-production:
    needs: [mark-for-release, deploy-to-uat]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production
        run: echo "Deploying to Production..."
